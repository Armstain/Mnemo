plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.mnemo'
version = '1.0.0'

android {
  namespace "expo.modules.mnemoreliability"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    // Keeps the geofencing consumer through release-build shrinking (see the file).
    consumerProguardFiles("proguard-rules.pro")
  }
}

dependencies {
  // Geofencing (MnemoGeofencingConsumer). Same version expo-location already brings into the app.
  implementation 'com.google.android.gms:play-services-location:21.0.1'
}
