name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1
      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Name the APK
        run: |
          name="mnemo-${GITHUB_REF_NAME//\//-}-arm64.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "APK=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          retention-days: 30
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --prerelease --title "Mnemo ${GITHUB_REF_NAME#v}" --notes "Android APK for 64-bit ARM phones. Signed with a debug key, so Android will ask you to allow installs from unknown sources."
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
    permissions:
      contents: write
